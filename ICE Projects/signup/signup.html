<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(120, 96, 64);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 17px 10px;
            font-family: Georgia, serif;
        }

        #formContainer {
            width: 420px;
            max-width: 100%;
            border: 10px solid #003399;
            border-radius: 30px;
            overflow: hidden;
            background: white;
        }

        /* Banner image */

        .banner {
            height: 170px;
            background-image: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            background-position: center 30%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .banner::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
        }

        .bannerText {
            position: relative;
            text-shadow: 2px 2px 3px black;
        }

        .bannerText h1 {
            font-size: 36px;
        }

        .bannerText p {
            font-size: 28px;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            left: 14px;
            z-index: 2;
            font-size: 20px;
            padding: 0 7px;
            cursor: pointer;
        }

        /* Form section */

        h3 {
            text-align: center;
            padding: 20px 5px;
            font-size: 18px;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 170px;
            gap: 20px 10px;
            padding: 0 19px 20px;
            align-items: center;
        }

        #myForm>label {
            font-size: 16px;
        }

        #myForm>input {
            width: 100%;
            height: 21px;
        }

        #myForm>div {
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        #myForm section {
            grid-column: 1 / 3;
            text-align: center;
        }

        #myForm section label {
            font-size: 16px;
        }

        #myForm section:last-child button {
            padding: 2px 8px;
        }

        /* Bottom book section */

        .books {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            height: 100px;
            background: white;
        }

        .book {
            display: block;
            overflow: hidden;
            background: #171717;
        }

        .book img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s;
        }

        .book:hover img {
            opacity: 0.7;
        }

        @media (max-width: 400px) {
            #myForm {
                grid-template-columns: 1fr 145px;
            }

            .bannerText h1 {
                font-size: 30px;
            }

            .bannerText p {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div id="formContainer">

        <!-- Banner -->
        <div class="banner">

            <button type="button" id="closeBtn">X</button>

            <div class="bannerText">
                <h1>Daily Feed</h1>
                <p>Scripture a Day</p>
            </div>

        </div>

        <!-- Form -->
        <h3>Sign Up for Daily Scripture Feed</h3>

        <form id="myForm">

            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>

            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>

        </form>

        <!-- Bottom Books -->
        <div class="books">

            <a class="book" href="https://www.churchofjesuschrist.org/study/scriptures/ot?lang=eng" target="_blank">
                <img src="images/old_testament.webp" alt="Old Testament">
            </a>

            <a class="book" href="https://www.churchofjesuschrist.org/study/scriptures/nt?lang=eng" target="_blank">
                <img src="images/new_testament.webp" alt="New Testament">
            </a>

            <a class="book" href="https://www.churchofjesuschrist.org/study/scriptures/bofm?lang=eng" target="_blank">
                <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            </a>

            <a class="book" href="https://www.churchofjesuschrist.org/study/scriptures/dc-testament?lang=eng"
                target="_blank">
                <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            </a>

            <a class="book" href="https://www.churchofjesuschrist.org/study/scriptures/pgp?lang=eng" target="_blank">
                <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
            </a>

        </div>

        <script>
            // Close the form
            document.getElementById("closeBtn").addEventListener("click", function () {
                document.getElementById("formContainer").style.display = "none";
            });

            const form = document.getElementById("myForm");
            const output = document.getElementById("output");

            // Handle form submission
            form.addEventListener("submit", function (event) {
                event.preventDefault();

                const formData = new FormData(form);
                const entries = [];

                for (const [key, value] of formData.entries()) {

                    // Never display passwords
                    if (key === "password") {
                        entries.push(`<strong>${key}</strong>: ********`);
                    } else {
                        entries.push(`<strong>${key}</strong>: ${value}`);
                    }
                }

                output.innerHTML = `
                <br>
                <h3>Here is the data that would be sent to the server:</h3>
                <ul>
                    ${entries.map(item => `<li>${item}</li>`).join('')}
                </ul>
            `;
            });
        </script>

</body>

</html>
