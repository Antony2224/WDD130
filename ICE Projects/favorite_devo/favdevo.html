<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>

          <tr>
            <td>Patrick Kearon</td>
            <td>Peace and Rest - Even Now</td>
            <td>BYU Provo</td>
            <td>2026</td>
          </tr>

          <tr>
            <td>Angela Watkins</td>
            <td>Faith Looks Up</td>
            <td>BYU Idaho</td>
            <td>2016</td>
          </tr>

          <tr>
            <td>Quentin L. Cook</td>
            <td>His Paths Are Righteous</td>
            <td>BYU Idaho</td>
            <td>2025</td>
          </tr>

          <tr>
            <td>Jeffery R. Holland</td>
            <td>"Remeber Lot's Wife"</td>
            <td>BYU Provo</td>
            <td>2009</td>
          </tr>

        </table>

        <h2>Add a Favorite Devotional</h2>

        <form id="devotionalForm">
          <label for="speaker">Speaker:</label>
          <input type="text" id="speaker" required>

          <label for="title">Title:</label>
          <input type="text" id="title" required>

          <label for="location">Location:</label>
          <input type="text" id="location" required>

          <label for="year">Year:</label>
          <input type="number" id="year" min="1900" max="2100" required>

          <button type="submit">Add Devotional</button>
        </form>

      </div>
    </main>
  </div>
</body>

</html>
