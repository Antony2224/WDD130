
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #E8ECED;
            background-color: #E8ECED;
        }

        .apostles-card {
            width: 100%;
            max-width: 710px;
            min-height: 550px;
            margin: 0 auto;
            padding: 12px 20px 25px;

            background-image: url("images/christus.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            border: 6px solid black;
            border-radius: 32px;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 6px;
            text-align: center;
            font-size: 30px;
            font-weight: normal;
        }

        h2 {
            margin: 8px 0 4px;
            text-align: center;
            font-size: 21px;
            font-weight: normal;
        }

        .first-presidency {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            justify-content: center;
            justify-items: center;
            gap: 18px;
            margin: 0 auto;
        }

        .first-presidency img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
            border: 6px solid #E8ECED;
        }

        .quorum-of-12-apostles {
            display: grid;
            grid-template-columns: repeat(4, 82px);
            justify-content: center;
            justify-items: center;
            gap: 24px 18px;
            margin: 0 auto;
            padding-top: 4px;
        }

        .quorum-of-12-apostles img {
            width: 82px;
            height: 82px;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
            border: 5px solid #E8ECED;
        }

        /* Smaller screens */
        @media (max-width: 520px) {
            body {
                padding: 12px;
            }

            .apostles-card {
                min-height: auto;
                padding: 14px 10px 24px;
                border-width: 4px;
                border-radius: 24px;
            }

            h1 {
                font-size: 26px;
            }

            h2 {
                font-size: 18px;
            }

            .first-presidency {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
            }

            .first-presidency img {
                width: 100%;
                max-width: 100px;
                height: auto;
                aspect-ratio: 1;
                border-width: 4px;
            }

            .quorum-of-12-apostles {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 14px 8px;
            }

            .quorum-of-12-apostles img {
                width: 100%;
                max-width: 76px;
                height: auto;
                aspect-ratio: 1;
                border-width: 4px;
            }
        }
    </style>
</head>

<body>
    <main>
        <section class="apostles-card">

            <h1>First Presidency</h1>

            <div class="first-presidency">
                <img src="images/eyring.webp" alt="President Eyring">
                <img src="images/oaks.webp" alt="President Oaks">
                <img src="images/christofferson.webp" alt="President Christofferson">
            </div>

            <h2>Quorum of the Twelve Apostles</h2>

            <div class="quorum-of-12-apostles">
                <img src="images/uchtdorf.webp" alt="Elder Uchtdorf">
                <img src="images/bednar.webp" alt="Elder Bednar">
                <img src="images/cook.webp" alt="Elder Cook">
                <img src="images/anderson.webp" alt="Elder Anderson">

                <img src="images/rasband.webp" alt="Elder Rasband">
                <img src="images/stevenson.webp" alt="Elder Stevenson">
                <img src="images/renlund.webp" alt="Elder Renlund">
                <img src="images/gong.webp" alt="Elder Gong">

                <img src="images/soares.webp" alt="Elder Soares">
                <img src="images/kearon.webp" alt="Elder Kearon">
                <img src="images/causse.webp" alt="Elder Causse">
                <img src="images/gilbert.webp" alt="Elder Gilbert">
            </div>

        </section>
    </main>
</body>
</html>
